<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Fun2Money Admin Pro</title>
<style>
:root{
  --bg:#060B18;
  --bg2:#0B1121;
  --card:rgba(13,20,40,.82);
  --card-solid:#0E162B;
  --stroke:rgba(255,255,255,.09);
  --stroke2:rgba(255,255,255,.14);
  --text:#EAF1FF;
  --muted:#9FB0D0;
  --blue:#4F6EF7;
  --blue2:#3B82F6;
  --green:#10B981;
  --green2:#059669;
  --red:#FB7185;
  --danger:#EF4444;
  --amber:#F59E0B;
  --shadow: 0 18px 40px rgba(0,0,0,.45);
  --radius-xl:20px;
  --radius-lg:14px;
  --radius-md:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{
  margin:0;padding:0;
  background:#000000;
  color:var(--text);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  height:100vh;width:100vw;
  overflow:hidden;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;user-select:text}
button{cursor:pointer}
.hidden{display:none !important}

/* Native Android Container Layout */
.app-container{
  max-width:480px;margin:0 auto;
  height:100vh;height:100dvh;
  position:relative;display:flex;flex-direction:column;
  background:
    radial-gradient(circle at top left, rgba(79,110,247,.16), transparent 30%),
    radial-gradient(circle at top right, rgba(45,212,191,.12), transparent 26%),
    linear-gradient(180deg, var(--bg), var(--bg2));
  box-shadow: 0 0 50px rgba(0,0,0,0.8);
  overflow:hidden;
}

/* Header Topbar */
.topbar{
  flex-shrink:0;
  height:56px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:0 14px;
  background:linear-gradient(180deg, rgba(6,11,24,.98), rgba(6,11,24,.90));
  backdrop-filter: blur(16px);
  border-bottom:1px solid var(--stroke);
  z-index:25;
}
.topbar-title{flex:1;text-align:center;font-size:17px;font-weight:800;letter-spacing:.2px}

/* Page Scrollable Area */
.app-content-area{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:12px 14px 20px;
  -webkit-overflow-scrolling: touch;
}

/* Buttons & UI Controls */
.icon-btn,.ghost-btn,.pill-btn,.tab-btn,.danger-btn,.primary-btn,.success-btn,.outline-btn{
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);
  color:var(--text);border-radius:14px;padding:10px 14px;
  font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:.15s transform, .15s background;
}
.icon-btn{width:40px;height:40px;padding:0;border-radius:12px}
.icon-btn:active,.primary-btn:active,.success-btn:active,.danger-btn:active,.outline-btn:active{transform:scale(.97)}
.primary-btn{background:linear-gradient(135deg, var(--blue), var(--blue2));border-color:transparent;font-weight:700;color:#FFF}
.success-btn{background:linear-gradient(135deg, var(--green), var(--green2));border-color:transparent;font-weight:700;color:#FFF}
.danger-btn{background:linear-gradient(135deg, var(--red), var(--danger));border-color:transparent;font-weight:700;color:#FFF}
.outline-btn{background:transparent;border-color:var(--stroke2)}
.pill-btn{padding:8px 12px;border-radius:999px;font-size:12px;flex-shrink:0}
.pill-btn.active{background:rgba(79,110,247,.25);border-color:rgba(79,110,247,.4);color:#FFF}

/* Layout & Cards */
.card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow);
  backdrop-filter: blur(12px);
  padding:14px;margin-bottom:12px;
}
.grid{display:grid;gap:10px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.h1{font-size:22px;font-weight:900}
.h2{font-size:18px;font-weight:800}
.h3{font-size:15px;font-weight:700}

/* Stats */
.stat-card{
  padding:12px 14px;border-radius:16px;
  background:linear-gradient(180deg, rgba(79,110,247,.12), rgba(255,255,255,.02));
  border:1px solid rgba(79,110,247,.18);
}
.stat-card .val{font-size:20px;font-weight:900;margin-top:6px}

/* Badges */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);font-size:11px;font-weight:700;
}
.badge.blue{background:rgba(59,130,246,.16);color:#60A5FA;border-color:rgba(59,130,246,.3)}
.badge.green{background:rgba(16,185,129,.16);color:#34D399;border-color:rgba(16,185,129,.3)}
.badge.red{background:rgba(239,68,68,.16);color:#F87171;border-color:rgba(239,68,68,.3)}
.badge.gray{background:rgba(255,255,255,.08);color:var(--muted)}

/* Inputs */
input,select,textarea{
  width:100%;padding:11px 12px;border-radius:12px;
  border:1px solid rgba(255,255,255,.11);
  background:rgba(0,0,0,.35);color:var(--text);outline:none;
}
textarea{min-height:85px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:8px 2px 4px;font-weight:600}

/* Lists & Responsive User Table */
.list-item{
  padding:12px;border-radius:16px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  margin-bottom:8px;
}
.table-container{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.table{display:grid;gap:8px;min-width:620px}
.table-row{
  display:grid;gap:6px;  grid-template-columns: 1.2fr 0.9fr 0.8fr 0.8fr 0.8fr 0.8fr 0.6fr;
  align-items:center;padding:10px;border-radius:12px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);
  font-size:11px;
}
.table-row.head{background:rgba(79,110,247,.15);font-weight:800;color:#93C5FD;border:none}

/* STABLE FIXED BOTTOM NAVIGATION BAR */
.bottom-nav-bar{
  flex-shrink:0;
  height:65px;
  background:#050913;
  border-top:1px solid rgba(255,255,255,.08);
  padding:6px 12px 8px;
  z-index:30;
}
.bottom-nav-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-items:center;height:100%;
}
.nav-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:6px 2px;border-radius:14px;background:transparent;
  border:none;color:#8E9BAE;font-size:11px;font-weight:600;
  transition:all .2s ease;cursor:pointer;
}
.nav-tab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-tab.active{
  color:#5271FF;
  background:rgba(24, 34, 68, 0.9);
  box-shadow: inset 0 0 0 1px rgba(79,110,247,0.2);
}
.nav-tab.active svg{stroke:#5271FF;fill:none}

/* Modals & Drawer */
.modal-backdrop,.drawer-backdrop{
  position:fixed;inset:0;background:rgba(5,8,16,.75);backdrop-filter:blur(6px);z-index:50;
}
.modal{
  position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(92vw, 440px);max-height:88vh;overflow-y:auto;
  background:var(--card-solid);border:1px solid var(--stroke);
  border-radius:22px;padding:16px;box-shadow:var(--shadow);
}
.drawer{
  position:fixed;top:0;right:0;z-index:51;height:100%;width:min(80vw,320px);
  background:var(--card-solid);border-left:1px solid var(--stroke);
  padding:16px;transform:translateX(100%);transition:transform .25s ease;
}
.drawer.open{transform:translateX(0)}

/* Key Value Badges */
.kv-box{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kv-box span{padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11px}

/* Toast Stack */
.toast-stack{
  position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column;gap:8px;width:min(90vw, 400px);pointer-events:none;
}
.toast{
  padding:12px 14px;border-radius:14px;background:#0C1222;
  border:1px solid var(--stroke);box-shadow:var(--shadow);font-size:12px;
  font-weight:600;border-left:4px solid var(--blue);color:#FFF;
}
.toast.good{border-left-color:var(--green)}
.toast.bad{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--amber)}

/* Auth Screen */
.login-screen{
  height:100%;width:100%;display:flex;align-items:center;justify-content:center;padding:16px;
}
.login-card{
  width:100%;max-width:380px;padding:20px;border-radius:24px;
  background:rgba(8,13,28,.82);border:1px solid var(--stroke);backdrop-filter:blur(16px);
}
</style>

const linkManifest = document.createElement('link');

  `;

function toast(msg, type="good"){
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.textContent = msg;
  $("#toastStack").appendChild(t);
  setTimeout(()=> { t.style.opacity="0"; t.style.transform="translateY(6px)"; }, 2200);
  setTimeout(()=> t.remove(), 2600);
}

function fmtMoney(v){ return "₹" + Math.round(Number(v||0)).toLocaleString('en-IN'); }
function fmtNum(v){ return Number(v||0).toLocaleString('en-IN'); }
function moneyNum(v){ const n = parseFloat(v); return isNaN(n) ? 0 : Math.max(0, Math.round(n)); }
function escapeHtml(s=""){ return String(s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function ts(v){
  if(!v) return "";
  if(v.toDate) return v.toDate().toLocaleString();
  if(v.seconds) return new Date(v.seconds * 1000).toLocaleString();
  if(typeof v === "number") return new Date(v).toLocaleString();
  return String(v);
}

// 1-Tap Direct Clipboard Copy
function copyToClipboard(text){
  if(!text) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(String(text)).then(()=>{
      toast(`Copied: ${text}`, "good");
    }).catch(()=>{
      copyFallback(text);
    });
  } else {
    copyFallback(text);
  }
}

function copyFallback(text){
  const ta = document.createElement("textarea");
  ta.value = String(text);
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand("copy");
    toast(`Copied: ${text}`, "good");
  }catch(e){
    toast("Copy failed", "warn");
  }
  document.body.removeChild(ta);
}

// Navigation Controls
function switchTab(tabId){
  $$(".nav-tab").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tabId));
  $$(".page-view").forEach(pg => pg.classList.add("hidden"));
  $(`#page-${tabId}`).classList.remove("hidden");
  const titles = {dashboard:"Dashboard", content:"Content Manager", users:"Users & Finance", subadmin:"Sub-Admin Control", settings:"Settings"};
  $("#pageTitle").textContent = titles[tabId] || "Dashboard";
  $(".app-content-area").scrollTop = 0;

function switchSubTab(subId){
  $$("[data-subtab]").forEach(btn => btn.classList.toggle("active", btn.dataset.subtab === subId));
  $$(".sub-panel").forEach(panel => panel.classList.add("hidden"));
  $(`#subpanel-${subId}`).classList.remove("hidden");
}

// Auth Check
auth.onAuthStateChanged(async user => {
  if(user){
    const doc = await db.collection("admins").doc(user.uid).get().catch(()=>null);
    if(doc && doc.exists){
      S.user = user;
      $("#authScreen").classList.add("hidden");
      $("#appShell").classList.remove("hidden");

  } else {
    S.user = null;
    $("#authScreen").classList.remove("hidden");
    $("#appShell").classList.add("hidden");
  }
});

// Auto Cleanup Transactions (> 12 hours) from Firebase quietly
let isCleaningUp = false;
async function performSilentCleanup(txns) {
  if (isCleaningUp) return;
  const now = Date.now();
  const twelveHoursMs = 12 * 60 * 60 * 1000;
  const batch = db.batch();
  let count = 0;

  txns.forEach(t => {
    if (!t.createdAt) return;
    const timeMs = t.createdAt.seconds ? t.createdAt.seconds * 1000 : new Date(t.createdAt).getTime();
    if (now - timeMs > twelveHoursMs) {
      batch.delete(db.collection("transactions").doc(t.id));
      count++;
    }
  });

  if (count > 0) {
    isCleaningUp = true;
    try {
      await batch.commit();
    } catch(e) { } // Silently fail if batch fails
    isCleaningUp = false;
  }
}

// Live Collections Listeners
function initDataListeners(){
  db.collection("settings").doc("general").onSnapshot(snap => {
    S.settings = snap.exists ? snap.data() : {};
    renderGeneralSettings();
  });
  db.collection("banners").orderBy("position", "asc").onSnapshot(snap => {
    S.banners = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderBanners();
  });
  db.collection("matches").orderBy("createdAt", "desc").onSnapshot(snap => {
    S.matches = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderMatches();
    renderStats();
  });
  db.collection("winners").orderBy("rank", "asc").onSnapshot(snap => {
    S.winners = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderWinners();
  });
  db.collection("profiles").onSnapshot(snap => {
    S.profiles = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderUsers();
    renderStats();
  });
  db.collection("transactions").orderBy("createdAt", "desc").onSnapshot(snap => {
    S.transactions = snap.docs.map(d=>({id:d.id, ...d.data()}));
    performSilentCleanup(S.transactions); // Automatically checks and purges old data
    renderRequests();
    renderActivities();
    renderStats();
  });
  db.collection("subProfiles").onSnapshot(snap => {
    S.subProfiles = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderSubAdmins();
  });
  db.collection("paymentUrls").onSnapshot(snap => {
    S.paymentUrls = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderPaymentUrls();
  });
}

// Render Engine
function renderStats(){
  const totalPlayers = S.settings.basePlayerCount || S.profiles.length || 0;
  const totalDeposits = S.transactions.filter(t => t.type === "deposit" && t.status === "success").reduce((a,b)=>a + Number(b.amount||0), 0);
  const pendingRequests = S.transactions.filter(t => t.status === "pending").length;
  const activeMatches = S.matches.filter(m => String(m.status||"").toLowerCase() === "live").length;

  $("#statsGrid").innerHTML = `
    <div class="stat-card"><div class="muted small">Total Players</div><div class="val">${fmtNum(totalPlayers)}</div></div>
    <div class="stat-card"><div class="muted small">Total Revenue</div><div class="val" style="color:var(--green)">${fmtMoney(totalDeposits)}</div></div>
    <div class="stat-card"><div class="muted small">Pending Requests</div><div class="val" style="color:var(--amber)">${pendingRequests}</div></div>
    <div class="stat-card"><div class="muted small">Live Matches</div><div class="val" style="color:var(--blue)">${activeMatches}</div></div>
  `;
}

// Activities UI - Filter dynamically for UI just in case network sync is slow
function renderActivities(){
  const list = $("#recentActivityList");
  const now = Date.now();
  const twelveHoursMs = 12 * 60 * 60 * 1000;
  
  const recent = S.transactions.filter(t => {
    if(!t.createdAt) return true;
    const timeMs = t.createdAt.seconds ? t.createdAt.seconds * 1000 : new Date(t.createdAt).getTime();
    return (now - timeMs) <= twelveHoursMs;
  });

  if(!recent.length){ list.innerHTML = `<div class="muted small">No recent logs</div>`; return; }
  
  list.innerHTML = recent.slice(0,10).map(t => {
    const txnProfile = S.profiles.find(p => p.email === t.userId);
    const txnDisplayId = txnProfile ? (txnProfile.userId || txnProfile.id) : (t.userId || '-');
    const txnEmail = txnProfile ? txnProfile.email : (t.userId || '-');
    const isDepTxn = String(t.type || '').toLowerCase() === "deposit";
    const txnPhone = isDepTxn ? escapeHtml(t.phone || (txnProfile?.phone || '-')) : escapeHtml(txnProfile?.phone || '-');
    return `
    <div class="list-item row between">
      <div>
        <div class="h3" style="text-transform:capitalize">${escapeHtml(t.type || 'Transaction')}</div>
        <div class="tiny muted">${escapeHtml(txnDisplayId)} · ${escapeHtml(txnEmail)} · ${escapeHtml(txnPhone)} · ${ts(t.createdAt)}</div>
      </div>
      <div style="text-align:right">
        <div class="h3">${fmtMoney(t.amount)}</div>
        <span class="badge ${t.status==='success'?'green':t.status==='rejected'?'red':'gray'}">${t.status||'pending'}</span>
      </div>
    </div>`;
  }).join("");
}

// MATCH / TOURNAMENT CREATION
function matchGameModeOptions(mode){
  if(mode === "BATTLE ROYALE") return ["SOLO","DUO","SQUAD"];
  if(mode === "LONG WOLF") return ["SOLO","DUO"];
  return ["SOLO","DUO","SQUAD","5V5","6V6"];
}

  const maps = ["BERMUDA","NEXTERRA","ALPINE","PURGATORY","KALAHARI","SOLARA"];
  const mode = data.gameType || "CLASH SQUAD";
  const teams = matchGameModeOptions(mode);
  return `
    <div class="row between" style="margin-bottom:12px"><div class="h2">${isEdit ? "Edit" : "Create"} Tournament</div><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <label>Title</label><input id="mTitle" value="${escapeHtml(data.title || '')}" placeholder="Match Title">
    <label>Banner Image URL</label><input id="mImage" value="${escapeHtml(data.image || '')}" placeholder="https://...">
    <div class="grid grid-2">
      <div><label>Entry Fee (₹)</label><input id="mEntry" type="number" value="${data.entryFee ?? 0}"></div>
      <div><label>Game Mode</label><select id="mGameMode">${modes.map(m=>`<option ${m===mode?'selected':''}>${m}</option>`).join("")}</select></div>
    </div>
    <div class="grid grid-2">
      <div><label>Team Mode</label><select id="mTeamMode">${teams.map(t=>`<option ${t===data.teamMode?'selected':''}>${t}</option>`).join("")}</select></div>
      <div><label>Map Type</label><select id="mMapType">${maps.map(t=>`<option ${t===data.mapType?'selected':''}>${t}</option>`).join("")}</select></div>
    </div>
    <div class="grid grid-2">
      <div><label>Per Kill Prize (₹)</label><input id="mPerKill" type="number" value="${data.perKillPrize ?? 0}"></div>
      <div><label>Win Prize (₹)</label><input id="mWinPrize" type="number" value="${data.winPrize ?? 0}"></div>
    </div>
    <label>Start Date & Time</label><input id="mStart" type="datetime-local" value="${data.startTime ? new Date(data.startTime.seconds ? data.startTime.seconds*1000 : data.startTime).toISOString().slice(0,16) : ''}">
    <label>Rules</label><textarea id="mRule" placeholder="Enter tournament rules...">${escapeHtml(data.rule || '')}</textarea>
    <label>Status</label>
    <select id="mStatus">
      ${["upcoming","live","coming-soon"].map(s=>`<option value="${s}" ${s===String(data.status||'upcoming')?'selected':''}>${s}</option>`).join("")}
    </select>
    <div class="grid grid-2">
      <div><label>Room ID</label><input id="mRoom" value="${escapeHtml(data.roomId || '')}"></div>
      <div><label>Password</label><input id="mPass" value="${escapeHtml(data.password || '')}"></div>
    </div>
    <button class="primary-btn" style="width:100%;margin-top:14px" id="saveMatchBtn">${isEdit ? "Update" : "Create"} Tournament</button>
  `;
}

function openMatchModal(data={}, id=null){
  showModal(renderMatchForm(data, !!id));
  const gameMode = $("#mGameMode");
  gameMode.onchange = ()=> {
    const list = matchGameModeOptions(gameMode.value);
    $("#mTeamMode").innerHTML = list.map(v=>`<option>${v}</option>`).join("");
  };
  $("#saveMatchBtn").onclick = async ()=>{
    const payload = {
      title: $("#mTitle").value.trim(),
      image: $("#mImage").value.trim(),
      entryFee: moneyNum($("#mEntry").value),
      gameType: $("#mGameMode").value,
      teamMode: $("#mTeamMode").value,
      mapType: $("#mMapType").value,
      perKillPrize: moneyNum($("#mPerKill").value),
      winPrize: moneyNum($("#mWinPrize").value),
      startTime: $("#mStart").value ? new Date($("#mStart").value) : null,
      rule: $("#mRule").value.trim(),
      status: $("#mStatus").value,
      roomId: $("#mRoom").value.trim(),
      password: $("#mPass").value.trim(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if(!payload.title) return toast("Title required","warn");
    if(id){
      await db.collection("matches").doc(id).set(payload, {merge:true});
      toast("Tournament updated");
    }else{
      await db.collection("matches").add(payload);
      toast("Tournament created");
    }
    closeModal();
  };
}

async function editUserBalance(uid, currentBal){
  const newVal = prompt("Enter updated Wallet Balance (₹):", currentBal);
  if(newVal === null) return;
  const num = moneyNum(newVal);
  await db.collection("profiles").doc(uid).set({ balance: num }, { merge: true });
  toast("Wallet balance updated");
}

async function toggleUserBan(uid, isCurrentlyBanned){
  await db.collection("profiles").doc(uid).set({ isBanned: !isCurrentlyBanned }, { merge: true });
  toast(isCurrentlyBanned ? "User Unbanned" : "User Banned", isCurrentlyBanned ? "good" : "bad");
}

    <div style="font-size:13px;line-height:1.5;color:#E2E8F0;margin-bottom:14px">
      Are you sure you want to permanently delete the profile of <b>${escapeHtml(username)}</b> (${escapeHtml(email)})?
      <br><br><span class="tiny muted" style="color:var(--amber)">This will erase all user data from Firestore. Auth deletion requires Firebase Console.</span>
    </div>
    <div class="row" style="gap:10px">
      <button class="outline-btn" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="danger-btn" style="flex:1" onclick="executeDeleteUser('${uid}', '${escapeHtml(email)}')">Delete Data</button>
    </div>
  `);
}

async function executeDeleteUser(uid, email){
  try {
    await db.collection("profiles").doc(uid).delete();
    
    const batch = db.batch();
    const txns = await db.collection("transactions").where("userId", "==", email).get();
    txns.forEach(d => batch.delete(d.ref));
    const jm = await db.collection("joinedMatches").where("userId", "==", email).get();
    jm.forEach(d => batch.delete(d.ref));
    await batch.commit();
    
    showModal(`
      <div class="h2" style="color:var(--green);text-align:center;margin-bottom:12px">✅ User Data Deleted</div>
      <div style="font-size:13px;line-height:1.5;color:#E2E8F0;margin-bottom:14px">
        Profile, transactions & joined matches deleted from Firestore.<br><br>
        <b style="color:var(--amber)">Note:</b> To completely remove the Auth account, go to Firebase Console → Authentication → Users and delete manually.
      </div>
      <button class="primary-btn" style="width:100%" onclick="closeModal()">OK</button>
    `);
    
  } catch(err) {
    toast("Failed to delete user: " + err.message, "bad");
  }
}

// DEPOSIT & WITHDRAW REQUESTS (FILTERED UI SAME AS RECENT ACTIVITY)
function renderRequests(){
  const list = $("#pendingRequestsList");
  const now = Date.now();
  const twelveHoursMs = 12 * 60 * 60 * 1000;
  
  // Only show requests from within the last 12 hours (also handled silently by the backend cleanup)
  const pending = S.transactions.filter(t => {
    if (t.status !== "pending") return false;
    if (!t.createdAt) return true;
    const timeMs = t.createdAt.seconds ? t.createdAt.seconds * 1000 : new Date(t.createdAt).getTime();
    return (now - timeMs) <= twelveHoursMs;
  });

  if(!pending.length){ list.innerHTML = `<div class="muted small">No pending deposit or withdraw requests</div>`; return; }

  list.innerHTML = pending.map(t => {
    const isDeposit = String(t.type || '').toLowerCase() === "deposit";
    const refDetail = isDeposit ? `UTR: ${t.utr || t.transactionId || t.details || 'N/A'}` : `UPI ID: ${t.upiId || t.details || 'N/A'}`;
    const reqProfile = S.profiles.find(p => p.email === t.userId);
    const displayFn2mId = escapeHtml(reqProfile ? (reqProfile.userId || reqProfile.id) : (t.userId || '-'));
    const displayPhone = isDeposit ? escapeHtml(t.phone || (reqProfile?.phone || '-')) : escapeHtml(reqProfile?.phone || '-');
    return `
      <div class="list-item">
        <div class="row between">
          <div>
            <div class="h3" style="text-transform:capitalize">${escapeHtml(t.type || 'Request')} - ${fmtMoney(t.amount)}</div>
            <div class="tiny muted">FN2M ID: <b style="color:var(--blue);cursor:pointer" onclick="copyToClipboard('${displayFn2mId}')">${displayFn2mId}</b> · Phone: ${displayPhone}</div>
          </div>
          <span class="badge blue">${escapeHtml(t.type || 'trx')}</span>
        </div>
        <div class="small" style="margin-top:6px;background:rgba(0,0,0,.35);padding:6px 8px;border-radius:8px;font-family:monospace;color:#93C5FD">
          ${escapeHtml(refDetail)}
        </div>
        <div class="row" style="margin-top:10px;gap:8px">
          <button class="success-btn" onclick="processRequest('${t.id}', '${t.userId}', ${t.amount}, '${t.type}', true)" style="padding:6px 12px;font-size:11px">Approve</button>
          <button class="danger-btn" onclick="processRequest('${t.id}', '${t.userId}', ${t.amount}, '${t.type}', false)" style="padding:6px 12px;font-size:11px">Reject</button>
        </div>
      </div>
    `;
  }).join("");
}

async function processRequest(trxId, userEmail, amount, type, isApprove){
  const trxRef = db.collection("transactions").doc(trxId);
  const profileSnap = await db.collection("profiles").where("email", "==", userEmail).get();
  if(profileSnap.empty) return toast("User profile not found", "warn");
  const userRef = profileSnap.docs[0].ref;

  if(isApprove){
    await db.runTransaction(async t => {
      const uSnap = await t.get(userRef);
      const currBal = uSnap.exists ? Number(uSnap.data().balance || 0) : 0;
      if(String(type).toLowerCase() === "deposit"){
        t.set(userRef, { balance: currBal + Number(amount) }, { merge: true });
      }
      t.set(trxRef, { status: "success", approvedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    });
    toast("Request approved successfully");
  } else {
    // REJECT ACTION: SET STATUS TO 'rejected' AND REFUND WITHDRAWAL AMOUNT TO USER WALLET
    await db.runTransaction(async t => {
      const uSnap = await t.get(userRef);
      const currBal = uSnap.exists ? Number(uSnap.data().balance || 0) : 0;
      if(String(type).toLowerCase().includes("withdraw")){
        t.set(userRef, { balance: currBal + Number(amount) }, { merge: true });
      }
      t.set(trxRef, { status: "rejected", rejectedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    });
    toast("Request rejected & balance refunded", "warn");
  }
}

      <div>FN2M ID</div>

function buildSubEmailOptions(){
  const existingEmails = new Set((S.subProfiles||[]).map(s => (s.email||'').toLowerCase()));
  return S.profiles.filter(p => !existingEmails.has((p.email||'').toLowerCase())).map(p => {
    const e = escapeHtml(p.email || '');
    const fid = escapeHtml(p.userId || p.id || '');
    const un = escapeHtml(p.username || '');
    return `<option value="${e}" data-fn2m="${fid}" data-phone="${escapeHtml(p.phone||'')}" data-pass="${escapeHtml(p.password||'')}" data-bal="${p.balance||0}" data-user="${un}">${e} (${fid})</option>`;
  }).join('');
}
$("#addSubBtn").onclick = ()=>{
  showModal(`
    <div class="row between" style="margin-bottom:12px"><div class="h2">Add SubAdmin</div><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <label>Select User by Email</label>
    <select id="sEmailSelect" onchange="document.getElementById('sFn2mId').value=this.options[this.selectedIndex]?.dataset.fn2m||''"><option value="">-- Choose user --</option>${buildSubEmailOptions()}</select>
    <label>FN2M ID</label><input id="sFn2mId" readonly placeholder="Auto-filled from selected user">
    <label>Access Key</label><input id="sKey" value="FN2M-CUTE${Math.random().toString(36).slice(2,6).toUpperCase()}">
    <button class="primary-btn" id="saveSubSubmit" style="width:100%;margin-top:14px">Add to SubAdmin</button>
  `);
  $("#saveSubSubmit").onclick = async ()=>{
    const sel = $("#sEmailSelect");
    const email = sel.value.trim().toLowerCase();
    if(!email) return toast("Please select a user email", "warn");
    const opt = sel.options[sel.selectedIndex];
    const fn2mId = opt?.dataset.fn2m || '';
    const phone = opt?.dataset.phone || '';
    const pass = opt?.dataset.pass || '';
    const bal = Number(opt?.dataset.bal || 0);
    const userName = opt?.dataset.user || email.split('@')[0];
    const accessKey = $("#sKey").value.trim();
    if(!/^FN2M-CUTE[A-Z0-9]{4}$/.test(accessKey)) return toast("Invalid access key format (FN2M-CUTEXXXX)", "warn");
    const sbId = fn2mId.replace(/^FN2M-/i, 'SB-');
    await db.collection("subProfiles").doc(email).set({
      email, sbId, accessKey, phone, password: pass, balance: bal, username: userName,
      status: "active",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    closeModal();
    toast("User added to SubAdmin");
  };
};
async function deleteSubAdmin(docId, email){
  if(!confirm(`Remove ${email} from SubAdmin?`)) return;
  await db.collection("subProfiles").doc(docId).delete();
  toast("Removed from SubAdmin");
}

function editSubAdmin(docId){
  const sub = S.subProfiles.find(s => s.id === docId);
  if(!sub) return toast("SubAdmin not found", "warn");
  showModal(`
    <div class="row between" style="margin-bottom:12px"><div class="h2">Edit SubAdmin</div><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <label>Email</label><input value="${escapeHtml(sub.email)}" readonly style="opacity:.6">
    <label>SB ID</label><input value="${escapeHtml(sub.sbId || '-')}" readonly style="opacity:.6">
    <label>Access Key</label><input id="editKey" value="${escapeHtml(sub.accessKey || '')}">
    <button class="primary-btn" id="saveEditSub" style="width:100%;margin-top:14px">Save Changes</button>
  `);
  $("#saveEditSub").onclick = async ()=>{
    const newKey = $("#editKey").value.trim();
    if(!newKey) return toast("Access key required", "warn");
    await db.collection("subProfiles").doc(docId).set({ accessKey: newKey }, { merge: true });
    closeModal();
    toast("SubAdmin updated");
  };
}

  `).join("");

$("#addPayRowBtn").onclick = ()=>{
  S.paymentUrls.push({ amount: 100, upiUrl: "" });
  renderPaymentUrls();
};

$("#savePayRowsBtn").onclick = async ()=>{
  const amts = $$(".pay-amt");
  const upis = $$(".pay-upi");
  const batch = db.batch();

  const prev = await db.collection("paymentUrls").get();
  prev.forEach(d => batch.delete(d.ref));

  amts.forEach((amtEl, i) => {
    const upiVal = upis[i]?.value.trim();
    if(upiVal){
      const docRef = db.collection("paymentUrls").doc();
      batch.set(docRef, { amount: moneyNum(amtEl.value), upiUrl: upiVal, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
  });

  await batch.commit();
  toast("Payment URLs updated");
};
