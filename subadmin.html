  --red:#FB7185;

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:

  radial-gradient(circle at top right, rgba(45,212,191,.12), transparent 24%),

  color:var(--text);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

}
body{min-height:100vh}
a{color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none !important}
.container{max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden}
.shell{min-height:100vh;display:flex;flex-direction:column}
.screen{min-height:100vh;display:flex;flex-direction:column}
.hero-bg{

.overlay-grad{

}
.topbar{

.topbar-title{flex:1;text-align:center;font-weight:800;letter-spacing:.2px;font-size:17px}
.icon-btn,.ghost-btn,.pill-btn,.tab-btn,.danger-btn,.primary-btn,.success-btn,.outline-btn{

  background:rgba(255,255,255,.04);

.icon-btn{width:42px;height:42px;display:grid;place-items:center;padding:0}
.icon-btn:active,.ghost-btn:active,.pill-btn:active,.tab-btn:active,.danger-btn:active,.primary-btn:active,.success-btn:active,.outline-btn:active{transform:scale(.98)}
.primary-btn{background:linear-gradient(135deg, var(--blue), var(--blue2));border-color:transparent;font-weight:700}
.success-btn{background:linear-gradient(135deg, var(--green), var(--green2));border-color:transparent;font-weight:700;color:#062019}
.danger-btn{background:linear-gradient(135deg, var(--red), var(--danger));border-color:transparent;font-weight:700}
.outline-btn{background:transparent}
.pill-btn{padding:8px 12px;border-radius:999px}
.card{

}
.card.soft{background:rgba(255,255,255,.04)}
.section{padding:0 14px 14px}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}

.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.center{justify-content:center}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.h1{font-size:22px;font-weight:900;line-height:1.1}
.h2{font-size:18px;font-weight:850}

function fmtMoney(v){
  const n = Number(v || 0);
  return "₹" + new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 }).format(Math.round(n));
}
function fmtNumber(v){
  const n = Number(v || 0);
  if (n >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/, "") + "B";
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(Math.round(n));
}

function presenceRef(email){ return rtdb.ref(`presence/${email.replace(/[.@]/g, '_')}`); }
function rtdbNotifyRef(){ return rtdb.ref("notifications"); }

async function setPresence(state){
  if(!S.user) return;
  await presenceRef(S.user.email).set({
    state,
    role: S.role,
    email: S.user.email,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  }).catch(()=>{});
}
function wirePresence(){
  if(!S.user) return;
  const ref = presenceRef(S.user.email);
  ref.onDisconnect().set({
    state: "offline",
    role: S.role,
    email: S.user.email,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });
  setPresence("online");
  window.addEventListener("beforeunload", ()=>{ try{ ref.set({state:"offline", role:S.role, email:S.user.email, updatedAt: firebase.database.ServerValue.TIMESTAMP}); }catch(e){} });
}
function listenNotifications(){
  if(!S.user) return;
  const ref = rtdbNotifyRef();
  ref.off();
  ref.limitToLast(30).on("value", snap => {
    const val = snap.val() || {};
    S.notifications = Object.entries(val).map(([id,v]) => ({id, ...v})).sort((a,b)=> (a.createdAt||0) - (b.createdAt||0));
    renderNotifications();
  });
}
function pushNotification(title, message, targetUser="all"){
  const n = {
    title, message, targetUser, createdAt: Date.now()
  };
  rtdbNotifyRef().push(n);
  return db.collection("notifications").add({
    title, message, targetUser, createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});
}

    } else {
      S.profile = null;
      $(".screen-login").classList.remove("hidden");
      $(".screen-app").classList.add("hidden");
      setPresence("offline").catch(()=>{});
      cb && cb(null);
    }
  });
}

function authError(msg){
  const el = $("#loginError");
  if(el){ el.textContent = msg; el.classList.remove("hidden"); }
}
function clearAuthError(){
  const el = $("#loginError");
  if(el){ el.textContent = ""; el.classList.add("hidden"); }
}
function copyVal(v){ navigator.clipboard?.writeText(String(v||"")).catch(()=>{}); }
function safeInt(v, fallback=0){ const n = parseInt(v,10); return Number.isFinite(n) ? n : fallback; }
function safeFloat(v, fallback=0){ const n = parseFloat(v); return Number.isFinite(n) ? n : fallback; }
function moneyNum(v){ return Math.max(0, Math.round(Number(v||0))); }

function loginShell(bg, title, subtitle){
  return `
  <div class="hero-login">
    <div class="hero-bg" style="background-image:url('${bg}')"></div>
    <div class="overlay-grad"></div>
    <div class="login-card">
      <div class="login-banner" style="background-image:url('${bg}')">
        <div class="caption">
          <div class="badge blue">Fun2Money</div>
          <div class="h1" style="margin-top:8px">${title}</div>
          <div class="muted small" style="margin-top:6px">${subtitle}</div>
        </div>
      </div>
      <div style="padding-top:14px" id="loginFormSlot"></div>
      <div id="loginError" class="hidden" style="margin-top:10px;color:#FB7185;font-size:13px"></div>
    </div>
  </div>`;
}
</script>
<script>
function subLoginForm(){
  return `
    <label>Email</label><input id="email" type="email" placeholder="name@gmail.com">
    <label>Access Key</label><input id="accessKey" placeholder="FN2M-CUTEXXXX">
    <button class="primary-btn" style="width:100%;margin-top:14px" id="loginBtn">Login</button>
    <div class="tiny muted" style="margin-top:12px">Gmail only. Access key regex: <code>^FN2M-CUTE[A-Z0-9]{4}$</code></div>
  `;
}
function ensureSubUI(){
  $(".screen-login").innerHTML = loginShell("https://uploads.onecompiler.io/44jqs6n4d/44rjbpcq4/40106.jpg", "Sub-Admin Panel", "Gmail + access key login, live tournaments aur wallet controls.");
  $("#loginFormSlot").innerHTML = subLoginForm();
  $("#loginBtn").onclick = subLogin;
  $(".screen-app").innerHTML = `
    <div class="shell">
      <div class="topbar">
        <div class="row">
          <div class="avatar">F</div>
          <div class="h3">Fun2Money</div>
        </div>
        <div class="topbar-title">Sub-Admin</div>
        <div class="badge blue" id="subBal">₹0</div>
      </div>
      <div class="page active" id="page-home">
        <div class="section">
          <div class="grid grid-2" id="subStats"></div>
        </div>
      </div>
      <div class="page" id="page-tournaments">
        <div class="section">
          <div class="card" style="padding:14px">
            <div class="row between"><div class="h3">Tournaments</div><button class="primary-btn" id="subAddTournament">Create</button></div>
            <div class="list" id="subMatchList" style="margin-top:12px"></div>
          </div>
        </div>
      </div>
      <div class="page" id="page-wallet">
        <div class="section">
          <div class="card" style="padding:14px">
            <div class="row between"><div><div class="muted small">Available Balance</div><div class="h1" id="subWalletBalance">₹0</div></div><button class="outline-btn" id="subWithdrawBtn">Withdraw</button></div>
            <div class="hr"></div>
            <div class="h3">Profile</div>
            <div id="subProfileBox"></div>
          </div>
        </div>
      </div>
      <div class="navbar">
        <div class="bottom-nav" style="--nav-count:3">
          <button class="tab-btn active" data-tab="home">Home</button>
          <button class="tab-btn" data-tab="tournaments">Tournaments</button>
          <button class="tab-btn" data-tab="wallet">Wallet</button>
        </div>
      </div>
    </div>

    <div class="drawer-backdrop hidden"></div>
    <div class="drawer">
      <div class="drawer-header">
        <div class="row">
          <div class="avatar">S</div>
          <div>
            <div class="h3" id="subName">Sub-Admin</div>
            <div class="tiny muted" id="subEmailText"></div>
          </div>
        </div>
        <button class="icon-btn" id="closeDrawerBtn">✕</button>
      </div>
      <div class="drawer-menu">
        <button class="ghost-btn" id="editSubProfileBtn">✏️ Edit Profile</button>
        <button class="ghost-btn" id="helpSubBtn">💬 Help & Support</button>
        <button class="danger-btn" id="logoutBtn">🚪 Logout</button>
      </div>
    </div>

    <div class="modal-backdrop hidden"></div>
    <div class="modal"></div>
    <div class="toast-stack"></div>
  `;
  wireSubUI();
}
function wireSubUI(){
  $("#openDrawerBtn") && ($("#openDrawerBtn").onclick = openDrawer);
  $("#closeDrawerBtn").onclick = closeDrawer;
  $(".drawer-backdrop").onclick = closeDrawer;
  $(".modal-backdrop").onclick = closeModal;
  $("#logoutBtn").onclick = ()=> auth.signOut();
  $("#helpSubBtn").onclick = ()=> window.open("https://chat.whatsapp.com/KiRYSqnMHbhLhpx4OC1IDD", "_blank");
  $("#editSubProfileBtn").onclick = openSubProfileModal;
  $$("[data-tab]").forEach(btn => btn.onclick = ()=> navSet(btn.dataset.tab));
  $("#subAddTournament").onclick = ()=> openSubTournamentModal();
  $("#subWithdrawBtn").onclick = openSubWithdrawModal;
}
async function subLogin(){
  clearAuthError();
  const email = $("#email").value.trim().toLowerCase();
  const accessKey = $("#accessKey").value.trim();
  if(!/@gmail\.com$/.test(email)) return authError("Gmail only.");
  if(!/^FN2M-CUTE[A-Z0-9]{4}$/.test(accessKey)) return authError("Invalid access key format.");
  try{
    const userCred = await auth.signInWithEmailAndPassword(email, accessKey);
    // In practice, use real email/password. For single-file simplicity, key is also auth password fallback.
    return userCred;
  }catch(err){
    // fallback check against subProfiles/accessKey
    const doc = await db.collection("subProfiles").doc(email).get();
    if(!doc.exists) return authError("Sub-admin profile not found.");
    const data = doc.data() || {};
    if(data.status === "deactive") return authError("Account deactivated.");
    if(String(data.accessKey || "").trim() !== accessKey) return authError("Wrong access key.");
    try{
      const cred = await auth.signInWithEmailAndPassword(email, accessKey);
      await postSubLogin(cred.user, data);
    }catch(e2){
      // Last resort: allow profile-based session state after password-style key
      S.user = { uid: email, email };
      await postSubLogin({ uid: email, email }, data, true);
    }
  }
}
async function postSubLogin(user, data, pseudo=false){
  $(".screen-login").classList.add("hidden");
  $(".screen-app").classList.remove("hidden");
  await db.collection("subWallets").doc(user.email).set({ balance: Number(data.balance || 0) }, { merge:true });
  listenSubCollections(user.email);
  renderSubAll();
  if(pseudo) toast("Logged in using access key", "warn");
}
function listenSubCollections(email){
  db.collection("matches").orderBy("createdAt", "desc").onSnapshot(snap => {
    S.matches = snap.docs.map(d => ({id:d.id, ...d.data()}));
    renderSubMatches();
    renderSubStats();
  });
  db.collection("transactions").orderBy("createdAt", "desc").limit(40).onSnapshot(snap => {
    S.transactions = snap.docs.map(d => ({id:d.id, ...d.data()}));
    renderSubStats();
  });
  db.collection("subProfiles").doc(email).onSnapshot(snap => {
    S.profile = snap.exists ? snap.data() : {};
    renderSubProfileBits();
  });
  db.collection("subWallets").doc(email).onSnapshot(snap => {
    const bal = snap.exists ? Number((snap.data() || {}).balance || 0) : 0;
    $("#subBal").textContent = fmtMoney(bal);
    $("#subWalletBalance") && ($("#subWalletBalance").textContent = fmtMoney(bal));
  });
}
function renderSubAll(){
  renderSubStats();
  renderSubMatches();
  renderSubProfileBits();
}
function renderSubStats(){
  const totalPlayers = S.settings.basePlayerCount || S.transactions.filter(t=>t.userId).length || 0;
  const myBalance = Number((S.profile || {}).balance || 0);
  const activeTournaments = S.matches.filter(m => String(m.status||"") === "live").length;
  const totalEarned = S.transactions.filter(t => t.email === (S.user && S.user.email) && t.status === "success").reduce((a,b)=>a + Number(b.amount || 0), 0);
  $("#subStats").innerHTML = `
    <div class="stat"><div class="muted small">Total Players</div><div class="value">${fmtNumber(totalPlayers)}</div></div>
    <div class="stat"><div class="muted small">My Balance</div><div class="value">${fmtMoney(myBalance)}</div></div>
    <div class="stat"><div class="muted small">Active Tournaments</div><div class="value">${fmtNumber(activeTournaments)}</div></div>
    <div class="stat"><div class="muted small">Total Earned</div><div class="value">${fmtMoney(totalEarned)}</div></div>
  `;
}
function renderSubMatches(){
  const list = $("#subMatchList");
  if(!list) return;
  list.innerHTML = S.matches.map(m => `
    <div class="item">
      <div class="row between">
        <div><div class="h3">${escapeHtml(m.title || "")}</div><div class="tiny muted">${escapeHtml(m.gameType || '')} · ${escapeHtml(m.status || '')}</div></div>
        <div class="badge gray">${fmtMoney(m.entryFee || 0)}</div>
      </div>
      <div class="row" style="margin-top:10px"><button class="outline-btn" data-edit-sub-match="${m.id}">Edit</button><button class="danger-btn" data-del-sub-match="${m.id}">Delete</button></div>
    </div>
  `).join("");
  $$("[data-edit-sub-match]").forEach(btn => btn.onclick = ()=> openSubTournamentModal(S.matches.find(x=>x.id===btn.dataset.editSubMatch), btn.dataset.editSubMatch));
  $$("[data-del-sub-match]").forEach(btn => btn.onclick = ()=> db.collection("matches").doc(btn.dataset.delSubMatch).delete().then(()=>toast("Deleted")));
}
function openSubTournamentModal(data={}, id=null){
  showModal(`
    <div class="row between"><div class="h2">${id ? "Edit" : "Create"} Tournament</div><button class="icon-btn" onclick="closeModal()">✕</button></div>
    ${renderMatchForm(data, !!id)}
    <div class="tiny muted" style="margin-top:10px">Room update rewards ₹0.10 to your sub-wallet.</div>
  `, true);
  const oldOnclick = $("#saveMatchBtn").onclick;
  $("#saveMatchBtn").onclick = async ()=>{
    const beforeRoom = data.roomId || "";
    const payload = {
      title: $("#mTitle").value.trim(),
      image: $("#mImage").value.trim(),
      entryFee: moneyNum($("#mEntry").value),
      gameType: $("#mGameMode").value,
      teamMode: $("#mTeamMode").value,
      mapType: $("#mMapType").value,
      perKillPrize: moneyNum($("#mPerKill").value),
      winPrize: moneyNum($("#mWinPrize").value),
      startTime: $("#mStart").value ? new Date($("#mStart").value) : null,
      rule: $("#mRule").value.trim(),
      status: $("#mStatus").value,
      roomId: $("#mRoom").value.trim(),
      password: $("#mPass").value.trim(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if(id){
      await db.collection("matches").doc(id).set(payload, { merge:true });
      if((payload.roomId !== beforeRoom || payload.password !== (data.password || "")) && S.user && S.user.email){
        await db.collection("subWallets").doc(S.user.email).set({ balance: firebase.firestore.FieldValue.increment(0.10) }, { merge:true });
        await db.collection("subProfiles").doc(S.user.email).set({ balance: firebase.firestore.FieldValue.increment(0.10) }, { merge:true });
      }
    } else {
      await db.collection("matches").add(payload);
    }
    closeModal();
    toast("Saved");
  };
}
function openSubWithdrawModal(){
  showModal(`
    <div class="row between"><div class="h2">Withdraw</div><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <label>UPI ID</label><input id="sUpi" placeholder="name@upi">
    <label>Amount (₹45 - ₹250)</label><input id="sAmt" type="number" min="45" max="250">
    <button class="primary-btn" id="submitSubWithdraw" style="width:100%;margin-top:12px">Submit</button>
  `);
  $("#submitSubWithdraw").onclick = async ()=>{
    const upi = $("#sUpi").value.trim();
    const amt = moneyNum($("#sAmt").value);
    if(!upi || amt < 45 || amt > 250) return toast("Amount must be ₹45-₹250", "warn");
    await db.collection("transactions").add({
      userId: S.user.email, email: S.user.email, type:"sub_withdraw", amount: amt, status:"pending", method:"UPI", details:`Sub withdraw to ${upi}`, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    toast("Withdraw request sent");
  };
}
function openSubProfileModal(){
  const p = S.profile || {};
  showModal(`
    <div class="row between"><div class="h2">Profile</div><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <label>Full Name</label><input id="spName" value="${escapeHtml(p.name || '')}">
    <label>Contact</label><input id="spContact" value="${escapeHtml(p.contact || '')}">
    <label>Gender</label><input id="spGender" value="${escapeHtml(p.gender || '')}">
    <label>Age</label><input id="spAge" type="number" value="${p.age ?? 18}">
    <label>Device</label><input id="spDevice" value="${escapeHtml(p.device || '')}">
    <button class="primary-btn" id="saveSubProfileBtn" style="width:100%;margin-top:12px">Save</button>
  `);
  $("#saveSubProfileBtn").onclick = async ()=>{
    await db.collection("subProfiles").doc(S.user.email).set({
      email:S.user.email,
      name: $("#spName").value.trim(),
      contact: $("#spContact").value.trim(),
      gender: $("#spGender").value.trim(),
      age: moneyNum($("#spAge").value),
      device: $("#spDevice").value.trim(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
    closeModal();
    toast("Profile saved");
  };
}
function renderSubProfileBits(){
  const p = S.profile || {};
  $("#subName").textContent = p.name || (S.user && S.user.email) || "Sub-Admin";
  $("#subEmailText").textContent = S.user && S.user.email || "";
  $("#subProfileBox").innerHTML = `
    <div class="item">
      <div class="row between"><div>Email</div><div>${escapeHtml(S.user && S.user.email || "")}</div></div>
      <div class="row between"><div>Status</div><div class="badge ${p.status === 'deactive' ? 'red' : 'green'}">${escapeHtml(p.status || 'active')}</div></div>
      <div class="row between"><div>Access Key</div><div>${escapeHtml(p.accessKey || '')}</div></div>
    </div>
  `;
}
function setupSubFlow(){
  ensureSubUI();
  auth.onAuthStateChanged(async user => {
    if(!user) return;
    S.user = user;
    const doc = await db.collection("subProfiles").doc(user.email).get();
    if(doc.exists){
      const data = doc.data() || {};
      if(data.status === "deactive"){ auth.signOut(); authError("Account deactivated"); return; }
      $(".screen-login").classList.add("hidden");
      $(".screen-app").classList.remove("hidden");
      await db.collection("subWallets").doc(user.email).set({ balance: Number(data.balance || 0) }, { merge:true });
      listenSubCollections(user.email);
      renderSubAll();
    } else {
      authError("No sub-profile found");
    }
  });
  ensureAuthGate(()=>{});
}
</script>

{
  // shared boot
  const loginBg = "https://uploads.onecompiler.io/44jqs6n4d/44rjbpcq4/40106.jpg";
  S.loginBg = loginBg;

</script>

(async function(){
  setupSubFlow();
  $(".screen-login").innerHTML = loginShell("https://uploads.onecompiler.io/44jqs6n4d/44rjbpcq4/40106.jpg", "Sub-Admin Panel", "Gmail + access key login, live tournaments aur wallet controls.");
  $("#loginFormSlot").innerHTML = subLoginForm();
  $("#loginBtn").onclick = subLogin;

</script>
