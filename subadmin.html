<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060B18">

<title>Fun2Money SubAdmin</title>
<style>
:root{
  --bg:#060B18;--bg2:#0B1121;--surface:rgba(13,20,40,.72);--surface2:rgba(9,15,32,.88);
  --stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.12);
  --text:#EAF1FF;--muted:#9FB0D0;
  --blue:#4F6EF7;--blue2:#3B82F6;--green:#2DD4BF;--green2:#10B981;--red:#FB7185;--danger:#EF4444;--amber:#F59E0B;
  --elevation1:0 2px 8px rgba(0,0,0,.3);--elevation2:0 8px 24px rgba(0,0,0,.35);--elevation3:0 18px 48px rgba(0,0,0,.45);
  --radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-xl:24px;
  --safe-bottom:env(safe-area-inset-bottom,0px);--nav-height:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none;touch-action:manipulation}
html,body{background:#060B18;color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100%}
body{min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer;position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,.15),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none;border-radius:inherit}
button:active::after{opacity:1}
.hidden{display:none!important}
.container{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.shell{min-height:100vh;display:flex;flex-direction:column}
.screen{min-height:100vh;display:flex;flex-direction:column}
body{background:radial-gradient(ellipse at 20% 0%,rgba(79,110,247,.12),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(45,212,191,.08),transparent 50%),linear-gradient(180deg,var(--bg),var(--bg2))}
.hero-bg{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(2px) brightness(.35);opacity:.3;pointer-events:none}
.overlay-grad{position:fixed;inset:0;background:linear-gradient(180deg,rgba(6,11,24,.2),rgba(6,11,24,.85));pointer-events:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px 8px;background:linear-gradient(180deg,rgba(6,11,24,.92),rgba(6,11,24,.35),transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.topbar-title{flex:1;text-align:center;font-weight:700;letter-spacing:.3px;font-size:16px;color:var(--muted)}
.icon-btn{border:none;background:rgba(255,255,255,.06);color:var(--text);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;padding:0;transition:background .2s}
.icon-btn:active{background:rgba(255,255,255,.12)}
.ghost-btn,.pill-btn,.tab-btn,.danger-btn,.primary-btn,.success-btn,.outline-btn{border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--text);border-radius:var(--radius-md);padding:13px 18px;font-size:14px;font-weight:600;transition:background .2s,border-color .2s;min-height:48px}
.primary-btn{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(79,110,247,.3)}
.primary-btn:active{box-shadow:0 2px 8px rgba(79,110,247,.2)}
.success-btn{background:linear-gradient(135deg,var(--green),var(--green2));border-color:transparent;color:#062019;box-shadow:0 4px 16px rgba(45,212,191,.25)}
.success-btn:active{box-shadow:0 2px 8px rgba(45,212,191,.15)}
.danger-btn{background:linear-gradient(135deg,var(--red),var(--danger));border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(239,68,68,.25)}
.danger-btn:active{box-shadow:0 2px 8px rgba(239,68,68,.15)}
.outline-btn{background:transparent;border-color:var(--stroke2)}
.outline-btn:active{background:rgba(255,255,255,.06)}
.pill-btn{padding:10px 16px;border-radius:999px}
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--radius-lg);box-shadow:var(--elevation1);backdrop-filter:blur(8px)}
.card.soft{background:rgba(255,255,255,.04)}
.section{padding:0 16px 16px}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.center{justify-content:center}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.h1{font-size:24px;font-weight:900;line-height:1.15}
.h2{font-size:20px;font-weight:850}
.h3{font-size:16px;font-weight:800}
.stat{padding:16px;border-radius:var(--radius-lg);background:linear-gradient(180deg,rgba(79,110,247,.1),rgba(255,255,255,.02));border:1px solid rgba(79,110,247,.15)}
.stat .value{font-size:22px;font-weight:900;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);font-size:12px;font-weight:600}
.badge.blue{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.25);color:#93C5FD}
.badge.green{background:rgba(16,185,129,.18);border-color:rgba(16,185,129,.25);color:#6EE7B7}
.badge.red{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.25);color:#FCA5A5}
.badge.gray{background:rgba(255,255,255,.06)}
input,select,textarea{width:100%;padding:14px 16px;border-radius:var(--radius-md);border:1.5px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--text);outline:none;font-size:15px;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:96px;resize:vertical}
input::placeholder,textarea::placeholder{color:#607090}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 2px 6px}
.hr{height:1px;background:var(--stroke);margin:14px 0}
.list{display:grid;gap:10px}
.item{padding:14px;border-radius:var(--radius-lg);background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.item.clickable{cursor:pointer}
.item.clickable:active{background:rgba(255,255,255,.08)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--green));font-weight:900;font-size:18px;flex-shrink:0}
.avatar-img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--stroke)}
.navbar{position:sticky;bottom:0;z-index:18;margin-top:auto;background:linear-gradient(180deg,rgba(6,11,24,.02),rgba(6,11,24,.85),rgba(6,11,24,.98));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:6px 12px calc(8px + var(--safe-bottom));border-top:1px solid var(--stroke)}
.bottom-nav{display:flex;gap:4px;justify-content:space-around}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:600;border-radius:var(--radius-md);min-height:auto;transition:color .2s}
.tab-btn .tab-icon{font-size:20px;line-height:1;transition:transform .2s}
.tab-btn.active{color:var(--blue);background:rgba(79,110,247,.1)}
.tab-btn.active .tab-icon{transform:scale(1.1)}
.modal-backdrop,.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:30;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal,.drawer{position:fixed;z-index:31;background:linear-gradient(180deg,rgba(20,30,55,.98),rgba(12,18,35,.98));border:1px solid var(--stroke);box-shadow:var(--elevation3)}
.modal{left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);opacity:0;width:min(92vw,420px);max-height:88vh;overflow:auto;border-radius:var(--radius-xl);padding:20px;animation:modalIn .25s ease forwards}
@keyframes modalIn{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.drawer{top:0;right:0;height:100%;width:min(86vw,340px);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);border-radius:var(--radius-xl) 0 0 var(--radius-xl);padding:20px}
.drawer.open{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px}
.drawer-menu{display:grid;gap:8px;margin-top:16px}
.drawer-menu button{justify-content:flex-start;text-align:left;padding:14px 16px;border-radius:var(--radius-md);font-size:14px;font-weight:600;display:flex;align-items:center;gap:12px}
.toast-stack{position:fixed;left:50%;bottom:calc(86px + var(--safe-bottom));transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{pointer-events:none;padding:14px 18px;border-radius:var(--radius-md);background:rgba(18,26,45,.98);border:1px solid var(--stroke);box-shadow:var(--elevation2);border-left:4px solid var(--blue2);animation:slideUp .3s ease;font-size:14px;font-weight:500}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.good{border-left-color:var(--green2)}
.toast.bad{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--amber)}
.hero-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.login-card{width:min(100%,420px);padding:24px;border-radius:var(--radius-xl);background:rgba(8,13,28,.75);border:1px solid var(--stroke);box-shadow:var(--elevation3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.login-banner{min-height:190px;border-radius:var(--radius-lg);background-size:cover;background-position:center;border:1px solid var(--stroke);position:relative;overflow:hidden}
.login-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,24,.1),rgba(6,11,24,.75))}
.login-banner .caption{position:absolute;left:16px;bottom:16px;right:16px;z-index:1}
.switch-row{display:flex;gap:8px;background:rgba(255,255,255,.04);padding:4px;border-radius:var(--radius-md);border:1px solid var(--stroke)}
.switch-row button{flex:1;border:none;background:transparent;color:var(--muted);padding:10px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;min-height:auto}
.switch-row button.active{background:rgba(79,110,247,.2);color:var(--text)}
.page{padding:8px 0 12px;display:none;animation:pageIn .25s ease}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.slider{display:flex;overflow:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.slider::-webkit-scrollbar{display:none}
.banner{min-width:100%;height:170px;border-radius:var(--radius-lg);overflow:hidden;position:relative;scroll-snap-align:start;border:1px solid var(--stroke)}
.banner img{width:100%;height:100%;object-fit:cover}
.banner .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75))}
.card-tournament{padding:14px;border-radius:var(--radius-lg);overflow:hidden;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.card-tournament img{width:100%;height:140px;object-fit:cover;border-radius:var(--radius-md)}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.kv span{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);font-size:12px}
.table{display:grid;gap:8px}
.table-row{display:grid;gap:8px;grid-template-columns:1.2fr .8fr .7fr .7fr;align-items:center;padding:12px 14px;border-radius:var(--radius-md);background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.table-row.head{background:rgba(79,110,247,.12);font-weight:700}
.table-row.cols-2{grid-template-columns:1fr auto}
.table-row.cols-3{grid-template-columns:1fr auto auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);font-size:12px}
.profile-pic{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--stroke2)}
.pay-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pay-btn{padding:16px;border-radius:var(--radius-md);border:1px solid var(--stroke);background:rgba(255,255,255,.04);text-align:left}
.pay-btn .amt{font-size:20px;font-weight:900;margin-top:4px}
.right{margin-left:auto}
.center-text{text-align:center}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{scrollbar-width:none}
@media(max-width:430px){
  .login-card{border-radius:var(--radius-lg);padding:18px}
  .table-row{grid-template-columns:1fr auto}
  .table-row>*:nth-child(3),.table-row>*:nth-child(4){grid-column:1/-1}
}
</style>

function toast(msg, type="good"){
  const el = document.createElement("div");

function fmtMoney(v){ const n = Number(v||0); return "₹"+new Intl.NumberFormat("en-IN",{maximumFractionDigits:0}).format(Math.round(n)); }
function fmtNumber(v){ const n=Number(v||0); if(n>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B'; if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M'; if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K'; return String(Math.round(n)); }
function randId(len=10){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let o=''; for(let i=0;i<len;i++) o+=c[Math.floor(Math.random()*c.length)]; return o; }
function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function ts(v){ if(!v) return ''; if(v.toDate) return v.toDate().toLocaleString(); if(v.seconds) return new Date(v.seconds*1000).toLocaleString(); if(typeof v==='number') return new Date(v).toLocaleString(); return String(v); }
function moneyNum(v){ return Math.max(0, Math.round(Number(v||0))); }

  $(".modal-backdrop").classList.remove("hidden");

function closeModal(){ $(".modal-backdrop").classList.add("hidden"); $(".modal").innerHTML = ""; }
function openDrawer(){ $(".drawer-backdrop").classList.remove("hidden"); $(".drawer").classList.add("open"); }
function closeDrawer(){ $(".drawer-backdrop").classList.add("hidden"); $(".drawer").classList.remove("open"); }

  $$("[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === page));

  if(n) n.classList.add("active");

function renderMatchForm(data={}, isEdit=false){
  const modes=["CLASH SQUAD","BATTLE ROYALE","LONG WOLF"];
  const maps=["BERMUDA","NEXTERRA","ALPINE","PURGATORY","KALAHARI","SOLARA"];

  const teams=teamsFunc(mode);
  return `
    <div class="row between"><div class="h2">${isEdit?"Edit":"Create"} Tournament</div><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <label>Title</label><input id="mTitle" value="${escapeHtml(data.title||'')}" placeholder="Match Title">
    <label>Banner Image URL</label><input id="mImage" value="${escapeHtml(data.image||'')}" placeholder="https://...">
    <div class="grid grid-2">
      <div><label>Entry Fee (₹)</label><input id="mEntry" type="number" value="${data.entryFee??0}"></div>
      <div><label>Game Mode</label><select id="mGameMode">${modes.map(m=>`<option ${m===mode?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    <div class="grid grid-2">
      <div><label>Team Mode</label><select id="mTeamMode">${teams.map(t=>`<option ${t===data.teamMode?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>Map Type</label><select id="mMapType">${maps.map(t=>`<option ${t===data.mapType?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="grid grid-2">
      <div><label>Per Kill Prize (₹)</label><input id="mPerKill" type="number" value="${data.perKillPrize??0}"></div>
      <div><label>Win Prize (₹)</label><input id="mWinPrize" type="number" value="${data.winPrize??0}"></div>
    </div>
    <label>Start Date & Time</label><input id="mStart" type="datetime-local" value="${data.startTime?new Date(data.startTime.seconds?data.startTime.seconds*1000:data.startTime).toISOString().slice(0,16):''}">
    <label>Rules</label><textarea id="mRule" placeholder="Enter tournament rules...">${escapeHtml(data.rule||'')}</textarea>
    <label>Status</label><select id="mStatus">${["upcoming","live","coming-soon"].map(s=>`<option value="${s}" ${s===String(data.status||'upcoming')?'selected':''}>${s}</option>`).join('')}</select>
    <div class="grid grid-2">
      <div><label>Room ID</label><input id="mRoom" value="${escapeHtml(data.roomId||'')}"></div>
      <div><label>Password</label><input id="mPass" value="${escapeHtml(data.password||'')}"></div>
    </div>
    <button class="primary-btn" style="width:100%;margin-top:14px" id="saveMatchBtn">${isEdit?"Update":"Create"} Tournament</button>`;
}

  return `<div class="hero-login"><div class="hero-bg" style="background-image:url('https://uploads.onecompiler.io/44jqs6n4d/44rjbpcq4/40106.jpg')"></div><div class="overlay-grad"></div><div class="login-card"><div class="login-banner" style="background-image:url('https://uploads.onecompiler.io/44jqs6n4d/44rjbpcq4/40106.jpg')"><div class="caption"><div class="badge blue">Fun2Money</div><div class="h1" style="margin-top:8px">User Panel</div><div class="muted small" style="margin-top:6px">Login to play tournaments & earn</div></div></div><div style="padding-top:14px" id="loginFormSlot"></div><div id="loginError" class="hidden" style="margin-top:10px;color:#FB7185;font-size:13px"></div></div></div>`;
}
function renderLoginForm(isSignup=false){
  return `
    <div class="switch-row" style="margin-bottom:14px">
      <button class="${!isSignup?'active':''}" onclick="renderLoginForm(false)">Login</button>
      <button class="${isSignup?'active':''}" onclick="renderLoginForm(true)">Sign Up</button>
    </div>
    <label>Email</label><input id="accEmail" type="email" placeholder="name@gmail.com">
    <label>Password</label><input id="accPass" type="password" placeholder="Min 6 chars">
    ${isSignup?'<label style="display:flex;align-items:center;gap:8px;margin-top:10px"><input id="termsCheck" type="checkbox"> I accept <a href="#" onclick="alert(\'Terms: Fair play, no refund on ban\')" style="color:var(--blue)">Terms</a></label>':''}
    <button class="primary-btn" style="width:100%;margin-top:14px" id="btnAuthSubmit">${isSignup?'Create Account':'Login'}</button>
  `;
}

// AUTH
let isSignup = false;
function renderLoginFormWrapper(signup){
  isSignup = signup;
  $("#loginFormSlot").innerHTML = renderLoginForm(signup);
  $("#btnAuthSubmit").onclick = handleAuth;
}
function handleAuth(){
  const email = $("#accEmail").value.trim().toLowerCase();
  const pass = $("#accPass").value;
  $("#loginError").classList.add("hidden");
  if(!email.endsWith("@gmail.com")){ $("#loginError").textContent="Valid @gmail.com required"; $("#loginError").classList.remove("hidden"); return; }
  if(pass.length < 6){ $("#loginError").textContent="Password min 6 chars"; $("#loginError").classList.remove("hidden"); return; }
  const doAuth = async ()=>{
    if(isSignup){
      if(!$("#termsCheck").checked){ $("#loginError").textContent="Please accept terms"; $("#loginError").classList.remove("hidden"); return; }
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      const fn2mId = "FN2M-"+randId(6);
      const bonus = Number(S.settings.signupBonus || 0);
      await db.collection("profiles").doc(fn2mId).set({
        balance: bonus, isBanned: false, userId: fn2mId,
        username: email.split('@')[0], email: email, password: pass,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      toast("Account created!");
    } else {
      await auth.signInWithEmailAndPassword(email, pass);
    }
  };
  doAuth().catch(err => {
    $("#loginError").textContent = err.message || "Auth failed";
    $("#loginError").classList.remove("hidden");
  });
}
// MAIN LISTENERS
function listenBaseCollections(){
  db.collection("settings").doc("general").onSnapshot(snap => { S.settings = snap.exists ? snap.data() : {}; });
  db.collection("matches").orderBy("createdAt", "desc").onSnapshot(snap => {
    S.matches = snap.docs.map(d => ({id:d.id, ...d.data()}));
    renderMatches(); renderHomeMatches(); renderSubAdminMatches();
  });
  db.collection("transactions").orderBy("createdAt", "desc").limit(40).onSnapshot(snap => {
    S.transactions = snap.docs.map(d => ({id:d.id, ...d.data()}));
    renderTransactions(); renderStats();
  });
}
function listenAccount(email){
  db.collection("profiles").where("email", "==", email).onSnapshot(snap => {
    if(snap.docs.length){
      S.profile = {id: snap.docs[0].id, ...snap.docs[0].data()};
      renderProfileBits();
    }
  });
}
// RENDER FUNCTIONS
function renderStats(){
  const p = S.profile || {};
  const bal = Number(p.balance || 0);
  $("#statsGrid").innerHTML = `
    <div class="stat"><div class="muted small">Balance</div><div class="value">${fmtMoney(bal)}</div></div>
    <div class="stat"><div class="muted small">Tournaments</div><div class="value">${S.matches.length}</div></div>`;
  $("#walletBalance").textContent = fmtMoney(bal);
}
function renderHomeMatches(){
  const list = $("#homeMatchList");
  if(!list) return;
  const activeFilter = $(".pill-btn.active")?.dataset.filter || "All";
  const items = S.matches.filter(m => activeFilter === "All" || String(m.status||'').toLowerCase() === activeFilter.toLowerCase());
  if(!items.length){ list.innerHTML = `<div class="muted small" style="padding:10px">No tournaments matching category</div>`; return; }
  list.innerHTML = items.map(m => `
    <div class="card-tournament">
      <img src="${escapeHtml(m.image || 'https://via.placeholder.com/400x180')}" alt="">
      <div class="row between" style="margin-top:10px">
        <div class="h3">${escapeHtml(m.title)}</div>
        <span class="badge ${m.status==='live'?'green':'blue'}">${m.status||'upcoming'}</span>
      </div>
      <div class="kv">
        <span>${m.gameType || 'CS'}</span>
        <span>${m.teamMode || 'SOLO'}</span>
        <span>${m.mapType || 'BERMUDA'}</span>
        <span>Entry: ${fmtMoney(m.entryFee)}</span>
        <span>Win: ${fmtMoney(m.winPrize)}</span>
        <span>Kill: ${fmtMoney(m.perKillPrize)}</span>
      </div>
    </div>
  `).join("");
}
function renderMatches(){
  const list = $("#allMatchList");
  if(!list) return;
  list.innerHTML = S.matches.length ? S.matches.map(m => `
    <div class="item row between">
      <div><div class="h3">${escapeHtml(m.title||'')}</div><div class="tiny muted">${escapeHtml(m.gameType||'')} · ₹${m.entryFee||0}</div></div>
      <span class="badge ${m.status==='live'?'green':m.status==='upcoming'?'blue':'gray'}">${m.status||'upcoming'}</span>
    </div>`).join("") : '<div class="muted small">No tournaments</div>';
}
function renderTransactions(){
  const list = $("#transactionList");
  if(!list) return;
  list.innerHTML = S.transactions.length ? S.transactions.map(t => `
    <div class="item row between">
      <div><div class="small" style="text-transform:capitalize">${escapeHtml(t.type||'trx')}</div><div class="tiny muted">${ts(t.createdAt)}</div></div>
      <div><b>${fmtMoney(t.amount)}</b></div>
    </div>`).join("") : '<div class="muted small">No transactions</div>';
}
function renderProfileBits(){
  const p = S.profile || {};
  const name = p.username || p.email || 'User';
  $("#profileAvatar").textContent = String(name)[0].toUpperCase();
  $("#profileName").textContent = name;
  $("#profileEmail").textContent = p.email || '';
  $("#drawerAvatar").textContent = String(name)[0].toUpperCase();
  $("#drawerName").textContent = name;
  $("#drawerEmail").textContent = p.email || '';
  $("#profileDetails").innerHTML = `
    <div class="item row between"><div>FN2M ID</div><b>${escapeHtml(p.userId||p.id||'-')}</b></div>
    <div class="item row between"><div>Email</div><b>${escapeHtml(p.email||'-')}</b></div>
    <div class="item row between"><div>Balance</div><b>${fmtMoney(p.balance||0)}</b></div>
    <div class="item row between"><div>Phone</div><b>${escapeHtml(p.phone||'-')}</b></div>`;
}
// SUB ADMIN (ACCESS KEY UNLOCK)
function showAccessKeyModal(){
  showModal(`
    <div class="row between"><div class="h2">Access Key</div><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <p class="small muted" style="margin:10px 0">Enter Sub-Admin access key to unlock tournament management tools.</p>
    <label>Access Key</label><input id="accessKeyInput" placeholder="FN2M-CUTEXXXX">
    <div class="row" style="margin-top:12px">
      <button class="outline-btn" id="getKeyBtn" style="flex:1;text-align:center">Get Key</button>
      <button class="primary-btn" id="submitAccessKey" style="flex:2;text-align:center">Unlock</button>
    </div>
  `);
  $("#getKeyBtn").onclick = ()=>{
    toast("Contact admin to get your access key","warn");
  };
  $("#submitAccessKey").onclick = async ()=>{
    const key = $("#accessKeyInput").value.trim();
    if(!/^FN2M-CUTE[A-Z0-9]{4}$/.test(key)) return toast("Invalid key format (FN2M-CUTEXXXX)","warn");
    // Validate against subProfiles collection
    const snap = await db.collection("subProfiles").where("accessKey","==",key).where("status","==","active").get();
    if(snap.empty) return toast("Invalid or inactive access key","bad");
    closeModal();
    S.subAdminUnlocked = true;
    // Show subadmin tab
    const nav = $("#bottomNav");
    if(!$("#tab-subadmin")){
      const btn = document.createElement("button");
      btn.className = "tab-btn"; btn.dataset.tab = "subadmin"; btn.id = "tab-subadmin";
      btn.innerHTML = '<span class="tab-icon">⚙️</span>Sub Admin';
      btn.onclick = ()=> navSet("subadmin");
      nav.appendChild(btn);
    }
    navSet("subadmin");
    toast("Sub Admin tools unlocked!","good");
  };
}
function renderSubAdminMatches(){
  const list = $("#subMatchList");
  if(!list) return;
  list.innerHTML = S.matches.length ? S.matches.map(m => `
    <div class="item">
      <div class="row between">
        <div><div class="h3">${escapeHtml(m.title||"")}</div><div class="tiny muted">${escapeHtml(m.gameType||'')} · ${escapeHtml(m.status||'')}</div></div>
        <div class="badge gray">${fmtMoney(m.entryFee||0)}</div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="outline-btn" data-edit-sub="${m.id}">Edit</button>
        <button class="danger-btn" data-del-sub="${m.id}">Delete</button>
      </div>
    </div>`).join("") : '<div class="muted small">No tournaments</div>';
  $$("[data-edit-sub]").forEach(b => b.onclick = ()=> openSubTournamentModal(S.matches.find(x=>x.id===b.dataset.editSub), b.dataset.editSub));
  $$("[data-del-sub]").forEach(b => b.onclick = ()=> { if(confirm("Delete this tournament?")) db.collection("matches").doc(b.dataset.delSub).delete().then(()=>toast("Deleted")); });
}
function openSubTournamentModal(data={}, id=null){
  showModal(renderMatchForm(data, !!id), true);
  const gm = $("#mGameMode");
  if(gm) gm.onchange = ()=>{
    const teamsList = {'CLASH SQUAD':['Solo','Duo','Trio','Squad'],'BATTLE ROYALE':['Solo','Duo','Trio','Squad'],'LONG WOLF':['Solo']};
    $("#mTeamMode").innerHTML = (teamsList[gm.value]||['Solo']).map(v=>`<option>${v}</option>`).join("");
  };
  $("#saveMatchBtn").onclick = async ()=>{
    const payload = {
      title: $("#mTitle").value.trim(),
      image: $("#mImage").value.trim(),
      entryFee: moneyNum($("#mEntry").value),
      gameType: $("#mGameMode").value,
      teamMode: $("#mTeamMode").value,
      mapType: $("#mMapType").value,
      perKillPrize: moneyNum($("#mPerKill").value),
      winPrize: moneyNum($("#mWinPrize").value),
      startTime: $("#mStart").value ? new Date($("#mStart").value) : null,
      rule: $("#mRule").value.trim(),
      status: $("#mStatus").value,
      roomId: $("#mRoom").value.trim(),
      password: $("#mPass").value.trim(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if(!payload.title) return toast("Title required","warn");
    if(id){ await db.collection("matches").doc(id).set(payload,{merge:true}); toast("Updated"); }
    else { await db.collection("matches").add(payload); toast("Created"); }
    closeModal();
  };
}
// WIRE UI
function wireAppUI(){
  $("#openDrawerBtn").onclick = openDrawer;
  $("#closeDrawerBtn").onclick = closeDrawer;
  $(".drawer-backdrop").onclick = closeDrawer;
  $(".modal-backdrop").onclick = closeModal;
  $("#drawerLogout").onclick = ()=>{ auth.signOut(); S.subAdminUnlocked = false; };
  $("#drawerHelp").onclick = ()=> window.open("https://chat.whatsapp.com/KiRYSqnMHbhLhpx4OC1IDD", "_blank");
  $("#drawerAccessKey").onclick = showAccessKeyModal;
  $$("[data-tab]").forEach(b => b.onclick = ()=> navSet(b.dataset.tab));
  $$("[data-filter]").forEach(chip => {
    chip.onclick = ()=>{
      $$("[data-filter]").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      renderHomeMatches();
    };
  });
  $("#subAddTournament").onclick = ()=> openSubTournamentModal();
}
// BOOT
function boot(){
  $(".screen-login").innerHTML = loginShell();
  renderLoginFormWrapper(false);
  $(".screen-app").innerHTML = buildAppUI();
  wireAppUI();
  listenBaseCollections();
  auth.onAuthStateChanged(user => {
    if(user){
      S.user = user;
      $(".screen-login").classList.add("hidden");
      $(".screen-app").classList.remove("hidden");
      listenAccount(user.email);
      renderStats();
    } else {
      S.user = null; S.profile = null;
      $(".screen-login").classList.remove("hidden");
      $(".screen-app").classList.add("hidden");
    }
  });
}
boot();
</script>
